<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>GravyPass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:#0b0810;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{max-width:420px;background:#110f1c;border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:32px 24px}
h1{font-size:28px;font-weight:800;margin-bottom:8px}
.sub{color:#a8a2c0;margin-bottom:24px;line-height:1.5}
.cta{display:block;width:100%;padding:18px;border:none;border-radius:14px;background:linear-gradient(90deg,#e874c2,#6b2dd9,#7dd3f5);color:#fff;font-size:17px;font-weight:900;text-transform:uppercase;text-decoration:none;letter-spacing:.03em}
.note{margin-top:20px;font-size:13px;color:#6b6680}
</style>
</head>
<body>
<div class="card">
  <h1>GravyPass</h1>
  <p class="sub">Full landing page file is large for the API upload. Download <code>index.html</code> from the chat artifacts and replace this file, or drag-and-drop it into this repo on GitHub.</p>
  <a class="cta" href="https://www.stw4c9hx.com/D6ZJJ4/2FG5TJF/">Get Started →</a>
  <p class="note">CTA already points to your link.</p>
</div>
</body>
</html>
